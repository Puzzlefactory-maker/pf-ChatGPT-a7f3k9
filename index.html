<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" id="appleTitle" content="ChatGPT">
<meta name="theme-color" content="#f9f9f9">
<link rel="apple-touch-icon" href="./icons/icon-512.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link id="manifestLink" rel="manifest" href="./manifest.webmanifest">
<title>ChatGPT</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  #phone { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #phone input, #phone textarea, #phone select, #phone #diagOut, #phone .kv { -webkit-user-select:text; user-select:text; }
  #phone img { -webkit-user-drag:none; -webkit-touch-callout:none; }
  html,body { height:100%; overscroll-behavior:none; }
  body { font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "맑은 고딕", Roboto, sans-serif;
    background:#333; display:flex; justify-content:center; align-items:center; overflow:hidden; color:#0d0d0d; }

  #phone { --safe-b:0px; width:100%; max-width:430px; height:100vh; height:100dvh; max-height:930px;
    position:relative; overflow:hidden; background:#f9f9f9; box-shadow:0 0 40px rgba(0,0,0,.4); }

  /* ================= 손님 화면: 메인 ================= */
  #home { position:absolute; inset:0; display:flex; flex-direction:column;
    background:
      radial-gradient(420px 320px at 12% 8%, #ffffff 0%, rgba(255,255,255,0) 70%),
      radial-gradient(420px 320px at 90% 10%, #ffffff 0%, rgba(255,255,255,0) 70%),
      radial-gradient(520px 260px at 50% 100%, #f1f1f1 0%, rgba(241,241,241,0) 75%),
      #f9f9f9; }
  .g-top { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:14px 13px 8px; }
  .rbtn { width:42px; height:42px; border-radius:50%; background:#fff; border:none; color:#111; cursor:pointer;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 8px rgba(0,0,0,.035); flex-shrink:0; }
  .rbtn svg { width:22px; height:22px; display:block; }
  .seg { display:flex; background:#e8e8e8; border-radius:999px; padding:4px; height:44px; }
  .seg div { min-width:77px; padding:0 20px; display:flex; align-items:center; justify-content:center;
    border-radius:999px; font-size:15.5px; color:#1a1a1a; cursor:pointer; letter-spacing:-.1px; }
  .seg div.on { background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.07); }

  #thread { flex:1; min-height:0; overflow-y:auto; padding:10px 20px 18px; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain; scrollbar-width:none; }
  #thread::-webkit-scrollbar { display:none; }
  .g-suggest { flex-shrink:0; display:flex; align-items:center; gap:18px; padding:0 30px 26px 28px;
    font-size:16px; color:#2b2b2b; letter-spacing:-.2px; }
  .g-suggest .emo { font-size:24px; line-height:1; width:22px; text-align:center; }
  .g-compose { flex-shrink:0; margin:0 32px calc(22px + env(safe-area-inset-bottom, 0px) + var(--safe-b));
    height:48px; background:#fff; border-radius:999px; display:flex; align-items:center; gap:12px;
    padding:0 7px 0 14px; box-shadow:0 2px 14px rgba(0,0,0,.055); }
  .g-compose .plus svg { width:22px; height:22px; display:block; color:#111; }
  .g-compose .ph { flex:1; min-width:0; font-size:15.5px; color:#8e8e8e; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .g-compose .mic svg { width:22px; height:22px; display:block; color:#111; }
  .g-compose .voice { width:34px; height:34px; border-radius:50%; background:#2d66ea; color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .g-compose .voice svg { width:18px; height:18px; display:block; }

  /* 대화 내용 */
  .m-user { display:flex; flex-direction:column; align-items:flex-end; margin:16px 0 10px; }
  .m-user .b { max-width:82%; background:#ececec; border-radius:22px; padding:10px 16px;
    font-size:16px; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .m-img { max-width:64%; border-radius:18px; overflow:hidden; margin-bottom:6px; line-height:0; background:#e5e5e5; cursor:pointer; }
  .m-img img { display:block; max-width:100%; max-height:280px; }
  .m-ai { margin:14px 0 4px; font-size:16px; line-height:1.68; color:#0d0d0d; word-break:break-word; letter-spacing:-.1px; }
  .m-ai .m-img { max-width:100%; margin:4px 0 10px; }
  .m-ai p { margin:0 0 12px; }
  .m-ai p:last-child { margin-bottom:0; }
  .m-ai h2 { font-size:19px; font-weight:700; margin:18px 0 8px; line-height:1.4; }
  .m-ai h3 { font-size:17px; font-weight:700; margin:16px 0 6px; line-height:1.4; }
  .m-ai h4 { font-size:16px; font-weight:700; margin:12px 0 4px; }
  .m-ai h2:first-child, .m-ai h3:first-child { margin-top:0; }
  .m-ai ul, .m-ai ol { margin:0 0 12px; padding-left:24px; }
  .m-ai li { margin:3px 0; }
  .m-ai strong { font-weight:700; }
  .m-ai hr { border:none; border-top:1px solid #e3e3e3; margin:18px 0; }
  .m-ai blockquote { border-left:3px solid #d5d5d5; padding-left:12px; color:#555; margin:0 0 12px; }
  .m-ai code { background:#ececec; border-radius:5px; padding:1px 5px; font-size:14px; font-family:Menlo, Consolas, monospace; }
  .md-code { background:#f0f0f0; border-radius:14px; margin:0 0 12px; overflow:hidden; }
  .md-code-h { font-size:12px; color:#666; padding:8px 14px 0; }
  .md-code pre { padding:10px 14px 12px; overflow-x:auto; font-size:13.5px; line-height:1.5; font-family:Menlo, Consolas, monospace; white-space:pre; }
  .m-think { font-size:14px; color:#8a8a8a; margin:14px 0 -6px; }
  .m-acts { display:flex; gap:16px; color:#7d7d7d; margin:8px 0 22px; }
  .m-acts svg { width:18px; height:18px; display:block; }

  /* ================= 손님 화면: 사이드바 ================= */
  #drawer { position:absolute; inset:0; z-index:30; pointer-events:none; }
  #drawer .scrim { position:absolute; inset:0; background:rgba(0,0,0,.47); opacity:0; transition:opacity .25s; }
  #drawer .panel { position:absolute; top:0; bottom:0; left:0; width:80%; max-width:360px;
    background:
      radial-gradient(300px 300px at 85% 6%, rgba(242,242,242,.9) 0%, rgba(255,255,255,0) 70%),
      #fff;
    transform:translateX(-102%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
    display:flex; flex-direction:column; }
  #drawer.open { pointer-events:auto; }
  #drawer.open .scrim { opacity:1; }
  #drawer.open .panel { transform:none; }
  .dr-head { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:14px 22px 10px 30px; }
  .dr-title { font-size:27px; font-weight:800; letter-spacing:-.4px; color:#0d0d0d; }
  .dr-scroll { flex:1; min-height:0; overflow-y:auto; padding:10px 0 130px; scrollbar-width:none; }
  .dr-scroll::-webkit-scrollbar { display:none; }
  .dr-it { display:flex; align-items:center; gap:14px; padding:0 30px; height:45px; font-size:16.5px;
    font-weight:600; color:#0d0d0d; cursor:pointer; letter-spacing:-.2px; }
  .dr-it svg { width:22px; height:22px; flex-shrink:0; display:block; }
  .dr-sec { font-size:15px; font-weight:700; padding:30px 30px 8px; color:#0d0d0d; }
  .dr-chat { display:flex; align-items:center; gap:14px; margin:0 12px; padding:0 18px; height:45px; font-size:16px;
    color:#0d0d0d; cursor:pointer; border-radius:12px; letter-spacing:-.2px; }
  .dr-chat span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .dr-chat svg { width:22px; height:22px; flex-shrink:0; display:block; }
  .dr-chat.cur { background:#f0f0f0; }
  .dr-empty { padding:20px 30px; font-size:13px; color:#9a9a9a; line-height:1.6; }
  .dr-foot { position:absolute; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:space-between;
    padding:40px 22px calc(18px + env(safe-area-inset-bottom, 0px) + var(--safe-b)) 30px; pointer-events:none;
    background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(255,255,255,.92) 45%, #fff 100%); }
  .dr-foot > * { pointer-events:auto; }
  .dr-new { height:46px; border-radius:999px; background:#2d66ea; color:#fff; border:none; cursor:pointer;
    display:flex; align-items:center; gap:10px; padding:0 26px 0 20px; font-size:17px; font-weight:600; font-family:inherit;
    box-shadow:0 4px 14px rgba(45,102,234,.25); }
  .dr-new svg { width:22px; height:22px; display:block; }
  .dr-gear { width:46px; height:46px; box-shadow:0 2px 12px rgba(0,0,0,.08); }

  /* 사진 크게 보기 */
  #photoViewer { display:none; position:absolute; inset:0; z-index:200; background:#000; align-items:center; justify-content:center; }
  #photoViewer.show { display:flex; }
  #photoViewer img { max-width:100%; max-height:100%; object-fit:contain; }
  #photoViewer .pv-close { position:absolute; top:14px; right:14px; width:38px; height:38px; border-radius:50%; border:none;
    background:rgba(255,255,255,.18); color:#fff; font-size:18px; cursor:pointer; }

  /* 이 폰을 쓸 지점 고르기 */
  #pickBranch { position:absolute; inset:0; z-index:70; background:#f3f3f3; display:none; align-items:center; justify-content:center; padding:22px; }
  #pickBranch.show { display:flex; }
  .bp-card { width:100%; max-width:360px; max-height:100%; overflow:auto; background:#fff; border-radius:20px; padding:22px 16px; box-shadow:0 10px 30px rgba(0,0,0,.08); }
  .bp-logo { width:56px; height:56px; margin:0 auto 12px; border-radius:18px; background:#0d0d0d; display:flex; align-items:center; justify-content:center; }
  .bp-logo svg { width:32px; height:32px; }
  .bp-title { font-size:17px; font-weight:800; text-align:center; }
  .bp-sub { font-size:12px; color:#8a8a8a; text-align:center; margin:6px 0 16px; line-height:1.55; }
  .bp-row { display:flex; align-items:center; gap:10px; padding:13px 12px; border-radius:12px; cursor:pointer; border:1px solid #e5e5e5; margin-bottom:8px; }
  .bp-row:hover { background:#f5f8ff; border-color:#2d66ea; }
  .bp-name { font-size:15.5px; font-weight:700; flex:1; min-width:0; }
  .bp-cnt { font-size:12px; color:#8a8a8a; font-weight:500; }
  .bp-go { font-size:12px; color:#2d66ea; font-weight:700; white-space:nowrap; }
  .bp-foot { font-size:11px; color:#aaa; text-align:center; margin-top:12px; line-height:1.5; }

  .empty { padding:60px 20px; text-align:center; color:#9a9a9a; font-size:14px; line-height:1.7; }

  /* ================= 관리자 패널 ================= */
  #adminOverlay { display:none; position:absolute; inset:0; background:#f4f5f7; z-index:50; flex-direction:column; }
  #adminOverlay.active { display:flex; }
  .admin-header { background:#202123; color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
  .admin-header h2 { font-size:17px; font-weight:700; }
  .admin-header button { background:rgba(255,255,255,.15); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:14px; cursor:pointer; font-weight:600; }
  .admin-body { flex:1; overflow-y:auto; padding:16px; }
  #adminBody:not(.room-open) #paneRoom, #adminBody:not(.room-open) #paneMsgs { display:none; }
  #adminBody.room-open #paneHome { display:none; }
  .pane-empty { color:#98a5b2; font-size:13px; text-align:center; padding:40px 16px; }

  @media (min-width:1000px) and (pointer:fine){
    #phone { max-width:none; max-height:none; width:100vw; height:100vh; box-shadow:none; background:#e9edf0; }
    #home, #drawer { max-width:430px; left:50%; transform:translateX(-50%); right:auto; width:100%; }
    #drawer .panel { width:80%; }
    .admin-body { display:flex; gap:14px; align-items:stretch; overflow:hidden; padding:14px; }
    .apane { overflow-y:auto; min-width:0; padding-right:2px; }
    #paneHome { flex:0 0 330px; }
    #paneRoom { flex:0 0 360px; }
    #paneMsgs { flex:1 1 auto; }
    #adminBody:not(.room-open) #paneRoom, #adminBody:not(.room-open) #paneMsgs, #adminBody.room-open #paneHome { display:block; }
    #backToRooms { display:none; }
    .msg-editor { max-width:88%; }
    .msg-editor.mine { margin-left:auto; }
  }

  .admin-section { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; }
  .admin-section h3 { font-size:14px; color:#2a3a4a; margin-bottom:12px; font-weight:700; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12.5px; color:#6a7a8a; margin-bottom:5px; font-weight:600; }
  .field input, .field textarea, .field select { width:100%; border:1px solid #d5dae0; border-radius:8px; padding:9px 11px; font-size:14px; font-family:inherit; background:#fff; }
  .field textarea { resize:vertical; min-height:56px; }
  .field.inline { display:flex; gap:8px; align-items:flex-end; }
  .field.inline > div { flex:1; }
  .chk { display:flex !important; align-items:center; gap:8px; cursor:pointer; }
  .chk input { width:auto !important; }
  .btn { border:none; border-radius:8px; padding:10px 14px; font-size:14px; cursor:pointer; font-weight:600; white-space:nowrap; flex-shrink:0; font-family:inherit; }
  .btn:disabled { opacity:.45; cursor:default; }
  .btn-primary { background:#202123; color:#fff; }
  .btn-blue { background:#2d66ea; color:#fff; }
  .btn-ghost { background:#eef0f3; color:#2a3a4a; }
  .btn-danger { background:#ffe5e3; color:#d63a2f; }
  .btn-sm { padding:6px 10px; font-size:12.5px; }
  .btn-block { width:100%; margin-top:6px; }
  .row-actions { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .admin-list-item { border:1px solid #e3e7ec; border-radius:10px; padding:11px 12px; margin-bottom:9px; background:#fff; }
  .admin-list-item.on { border-color:#202123; background:#f7f9fb; }
  .admin-list-item.picked { border-color:#2d66ea; background:#f3f7ff; box-shadow:0 0 0 2px #2d66ea22 inset; }
  .sortable .admin-list-item { touch-action:manipulation; }
  .admin-list-item.dragging { opacity:.92; box-shadow:0 8px 20px rgba(0,0,0,.18); border-color:#202123; position:relative; z-index:5; }
  .drag-hint { font-size:11.5px; color:#98a5b2; margin:0 0 8px; }
  .crumb { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .crumb-txt { font-size:13px; font-weight:700; color:#2a3a4a; word-break:break-all; }
  .crumb-txt .sep { color:#a8b4c0; font-weight:400; margin:0 3px; }
  .node-name { font-weight:700; font-size:14.5px; color:#2a3a4a; cursor:pointer; }
  .node-name .pen { font-size:11px; color:#a8b4c0; margin-left:4px; }
  .admin-list-item .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .rname { font-weight:700; font-size:14.5px; color:#2a3a4a; word-break:break-all; }
  .rsub { font-size:12px; color:#8a97a5; margin-top:2px; word-break:break-all; }
  .me-tag { background:#2d66ea; color:#fff; font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:6px; }
  .admin-section h3.foldable { cursor:pointer; user-select:none; }
  .fold-arrow { font-size:11px; color:#8a97a5; }
  .admin-section.folded .fold-body { display:none; }
  .part-row { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid #f0f2f5; flex-wrap:wrap; }
  .part-row:last-child { border-bottom:none; }
  .part-row .pn { font-weight:700; font-size:14px; flex:1; min-width:80px; }

  .msg-editor { border:1px solid #e3e7ec; border-radius:10px; padding:10px; margin-bottom:9px; background:#fafbfc; }
  .msg-editor.mine { background:#f2f2f2; border-color:#dcdcdc; }
  .msg-editor .who { font-size:11.5px; font-weight:700; color:#10a37f; margin-bottom:6px; }
  .msg-editor.mine .who { color:#6a6a6a; text-align:right; }
  .msg-editor .er1 { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .msg-editor select, .msg-editor input, .msg-editor textarea { border:1px solid #d5dae0; border-radius:8px; padding:7px 9px; font-size:14px; font-family:inherit; background:#fff; }
  .msg-editor textarea { width:100%; min-height:60px; resize:vertical; line-height:1.5; }
  .msg-editor.ai textarea { min-height:120px; }
  .msg-editor .er4 { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .msg-editor .er-pv { width:56px; height:56px; border-radius:8px; overflow:hidden; background:#eef0f3; }
  .msg-editor .er-pv img { width:100%; height:100%; object-fit:cover; display:block; }
  .add-row { display:flex; gap:8px; margin-top:12px; justify-content:space-between; }

  .hint { font-size:12px; color:#98a5b2; line-height:1.6; margin-top:8px; }
  .kv { font-size:12.5px; color:#6a7a8a; line-height:1.8; word-break:break-all; }
  .kv b { color:#2a3a4a; }
  .mode-pill { position:absolute; top:4px; left:50%; transform:translateX(-50%); z-index:40; background:rgba(0,0,0,.35); color:#fff; font-size:10.5px; padding:2px 9px; border-radius:10px; display:none; pointer-events:none; }
  .mode-pill.show { display:block; }
  .toast { position:absolute; bottom:90px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.8); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px; z-index:220; opacity:0; transition:opacity .25s; pointer-events:none; max-width:80%; text-align:center; }
  .toast.show { opacity:1; }
  #confirmBox { display:none; position:absolute; inset:0; z-index:240; background:rgba(0,0,0,.4); align-items:center; justify-content:center; padding:30px; }
  #confirmBox.show { display:flex; }
  .confirm-card { background:#fff; border-radius:14px; padding:22px 20px 16px; width:100%; max-width:300px; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .confirm-msg { font-size:15px; color:#2a3a4a; line-height:1.5; margin-bottom:18px; text-align:center; white-space:pre-wrap; }
  .confirm-actions { display:flex; gap:8px; }
  .confirm-actions .btn { flex:1; padding:11px; }
</style>
</head>
<body>
<div id="phone" style="--safe-b: 0px;">
  <div class="mode-pill" id="modePill">관리자 모드</div>

  <!-- 메인 화면 -->
  <div id="home">
    <div class="g-top">
      <button class="rbtn" id="btnMenu" title="메뉴">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3.5 8.5h16"/><path d="M3.5 15.5h10"/></svg>
      </button>
      <div class="seg" id="seg"><div class="on" id="segA">Chat</div><div id="segB">Work</div></div>
      <button class="rbtn" id="btnNew" title="새 채팅">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.2 19.2A8.3 8.3 0 1 0 4.1 15.4"/><path d="M4.1 15.4 3.6 20.4l3.6-1.2"/></svg>
      </button>
    </div>
    <div id="thread"></div>
    <div class="g-suggest" id="suggest"></div>
    <div class="g-compose">
      <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg></span>
      <span class="ph" id="phText">ChatGPT에게 물어보세요</span>
      <span class="mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>
      <span class="voice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 10v4M10 7v10M14 9v6M18 11v2"/></svg></span>
    </div>
  </div>

  <!-- 사이드바 -->
  <div id="drawer">
    <div class="scrim" id="drScrim"></div>
    <div class="panel" id="drPanel">
      <div class="dr-head">
        <div class="dr-title" id="drTitle">ChatGPT</div>
        <button class="rbtn" title="검색"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M20 20l-4.3-4.3"/></svg></button>
      </div>

function fingerprint(o){
  let s;
  try{ s = JSON.stringify(o); }catch(e){ return 'x'; }
  let h = 0x811c9dc5;
  for(let i=0;i<s.length;i++){ h = (h ^ s.charCodeAt(i)) >>> 0; h = (h * 0x01000193) >>> 0; }
  return h.toString(36) + '-' + s.length.toString(36);
}

const IDB_NAME = 'danseo_gpt';
const IDB_STORE = 'box';
const IDB_KEY = 'main';
let idbState = 'ok';
let idbBox = null;
let saveBlocked = false;
let saveWarned = false;
let storeKind = 'localStorage';

function idbOpen(){
  return new Promise((res, rej)=>{
    if(!self.indexedDB){ idbState = 'unavailable'; return rej(new Error('없음')); }
    if(location.protocol === 'file:'){ idbState = 'unavailable'; return rej(new Error('파일 직접 열기')); }
    let settled = false;
    const finish = (fn, v)=>{ if(!settled){ settled = true; clearTimeout(timer); fn(v); } };
    const timer = setTimeout(()=>{ if(!settled){ settled = true; idbState = 'unavailable'; rej(new Error('시간 초과')); } }, 2500);
    let rq;
    try{ rq = indexedDB.open(IDB_NAME, 1); }
    catch(e){ idbState = 'unavailable'; return finish(rej, e); }
    rq.onupgradeneeded = ()=>{ try{ rq.result.createObjectStore(IDB_STORE); }catch(e){} };
    rq.onsuccess = ()=>{ idbState = 'ok'; finish(res, rq.result); };
    rq.onerror   = ()=>{ if(idbState !== 'unavailable') idbState = 'error'; finish(rej, rq.error || new Error('열기 실패')); };
    rq.onblocked = ()=>{ idbState = 'unavailable'; finish(rej, new Error('차단됨')); };
  });
}
function idbRead(){
  return idbOpen().then(db=> new Promise(res=>{
    let tx;
    try{ tx = db.transaction(IDB_STORE, 'readonly'); }
    catch(e){ return res({ok:false, value:null}); }
    const rq = tx.objectStore(IDB_STORE).get(IDB_KEY);
    rq.onsuccess = ()=> res({ok:true, value:rq.result || null});
    rq.onerror   = ()=> res({ok:false, value:null});
  })).catch(()=> ({ok:false, value:null}));
}
function idbWrite(v){
  return idbOpen().then(db=> new Promise((res, rej)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(v, IDB_KEY);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> rej(tx.error || new Error('저장 실패'));
    tx.onabort    = ()=> rej(tx.error || new Error('저장 중단'));
  }));
}
function idbClear(){
  return idbOpen().then(db=> new Promise(res=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).delete(IDB_KEY);
    tx.oncomplete = ()=> res(true);
    tx.onerror    = ()=> res(false);
    tx.onabort    = ()=> res(false);
  })).catch(()=> false);
}
let persistState = '확인 중';

  try{

    return (navigator.storage.persisted ? navigator.storage.persisted() : Promise.resolve(false))
      .then(p=> p ? true : navigator.storage.persist())
      .then(p=>{ persistState = p ? '켜짐' : '꺼짐'; })
      .catch(()=>{ persistState = '알 수 없음'; });
  }catch(e){ persistState = '알 수 없음'; return Promise.resolve(); }
}
let quotaText = '확인 중';

  try{

let baseFp = null;   /* 파일에서 막 읽어온 상태의 지문 */

function load(){

      idbBox = box;
      baseFp = box.base || null;
      return normalize(box.data);
    }
    if(!saveBlocked) wipeStored();
    const fresh = normalize(deepCopy(EMBEDDED_DATA));
    baseFp = fingerprint(fresh);

}

  const i = txt.indexOf(MARK_S), j = txt.indexOf(MARK_E);

    return (new Function(block + '\nreturn { v: DATA_VERSION, d: EMBEDDED_DATA };'))();

  Promise.all(steps).then(go, go);
}
function checkForUpdate(manual){

      }
      if(same){ if(manual) toast('이미 최신 파일입니다'); return; }
      const tag = got.v + '|' + fileFp;
      let tried = null;
      try{ tried = sessionStorage.getItem('dg_upd'); }catch(e){}
      if(!manual && tried === tag){
        toast('새 파일이 있는데 적용되지 않았습니다. 관리자 모드에서 “새 파일 확인”을 눌러주세요.');
        return;
      }
      try{ sessionStorage.setItem('dg_upd', tag); }catch(e){}
      toast('새 파일을 발견했습니다. 새 내용으로 다시 엽니다…');
      setTimeout(forceUpdate, 700);
    })
    .catch(()=>{ if(manual) toast('서버에 연결할 수 없습니다'); });
}

/* ---------- 데이터 정리 ---------- */
function listDefaults(L){
  L.label = (L.label === undefined) ? '' : L.label;
  L.placeholder = L.placeholder || 'ChatGPT에게 물어보세요';
  L.modeA = L.modeA || 'Chat';
  L.modeB = L.modeB || 'Work';
  L.bottomPad = Math.max(0, Number(L.bottomPad)||0);
  L.suggest = Object.assign({ show:true, emoji:'📍', text:'' }, L.suggest||{});
  delete L.autoSort;
  L.startDrawer = !!L.startDrawer;
  if(!Array.isArray(L.rooms)) L.rooms = [];
  if(!Array.isArray(L.people)) L.people = [];
  return L;
}
function normalize(d){
  if(!d || typeof d !== 'object') d = {};
  if(!Array.isArray(d.lists)) d.lists = [];
  if(!d.appName) d.appName = 'ChatGPT';
  d.lists = d.lists.filter(L=> L && typeof L === 'object');
  if(!d.lists.length) d.lists = [{ key:'기본', rooms:[], people:[] }];
  const usedKeys = [];
  d.lists.forEach((L, i)=>{
    listDefaults(L);
    let k = String(L.key || ('목록'+(i+1))).trim() || ('목록'+(i+1));
    while(usedKeys.indexOf(normKey(k)) !== -1) k = k + '_2';
    usedKeys.push(normKey(k));
    L.key = k;
    L.rooms = L.rooms.filter(r=> r && typeof r === 'object');
    L.rooms.forEach(room=>{
      if(!room.id) room.id = id();
      if(typeof room.title !== 'string') room.title = '새 채팅';
      delete room.date; delete room.time;
      if(!Array.isArray(room.participants)) room.participants = [];
      room.participants = room.participants.filter(p=> p && typeof p === 'object');
      room.participants.forEach(p=>{ if(!p.id) p.id = id(); p.pinned = !!p.pinned; });
      if(!Array.isArray(room.messages)) room.messages = [];
      room.messages = room.messages.filter(m=> m && typeof m === 'object');
      room.messages.forEach(m=>{
        if(!m.id) m.id = id();
        if(m.role !== 'assistant') m.role = 'user';
        if(m.text === undefined) m.text = '';
        if(m.image === undefined) m.image = '';
        if(m.think === undefined) m.think = '';
      });
    });
  });
  const keep = data;
  data = d;                 /* ensureTree 안의 도우미들이 data 를 참조한다 */
  try{ ensureTree(d); }catch(e){}
  try{ d.lists.forEach(ensurePeople); }catch(e){}
  data = keep;
  return d;
}
function id(){ return 'x'+Math.random().toString(36).slice(2,9); }
function normKey(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,'_'); }
function curList(){ return data.lists[listIdx] || data.lists[0]; }

let branchLock = null;

}
function lockedC1(){
  if(!branchLock || !data) return null;
  const byId = (data.tree||[]).find(c=>c.id === branchLock.id);
  if(byId){ if(branchLock.name !== byId.name){ branchLock.name = byId.name; saveBranch(); } return byId; }
  const byName = (data.tree||[]).find(c=>c.name === branchLock.name);
  if(byName){ branchLock = {id:byName.id, name:byName.name}; saveBranch(); return byName; }
  return null;
}
function branchLocked(){ return !wideAdmin() && !!lockedC1(); }

/* ---------- 인물 · 이 기기에서 볼 “나” ---------- */
let viewAs = {};
function loadView(){

  catch(e){ viewAs = {}; }
}

function personId(name){
  const s = normKey(name);
  let h = 0x811c9dc5;
  for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
  return 'p' + h.toString(36);
}
/* 채팅의 참여자 이름을 모두 인물 명단으로 모은다 */
function ensurePeople(L){
  if(!L) return [];
  if(!Array.isArray(L.people)) L.people = [];
  for(let i = L.people.length - 1; i >= 0; i--){
    const p = L.people[i];
    if(!p || typeof p !== 'object' || !String(p.name||'').trim()) L.people.splice(i, 1);
  }
  const byName = {};
  L.people.forEach(p=>{ if(!p.id) p.id = personId(p.name); byName[normKey(p.name)] = p; });
  (L.rooms||[]).forEach(r=> (r.participants||[]).forEach(pt=>{
    const k = normKey(pt.name);
    if(!k || byName[k]) return;
    let pid = personId(pt.name), n = 2;
    while(L.people.some(x=>x.id === pid)){ pid = personId(pt.name) + '_' + (n++); }
    const p = {id:pid, name:pt.name};
    byName[k] = p; L.people.push(p);
  }));
  return L.people;
}
function peopleOf(L){ return ensurePeople(L || curList()); }
function personById(L, pid){ const ps = (L && L.people) || []; return pid ? (ps.find(p=>p && p.id===pid) || null) : null; }
function personByName(L, name){ const k = normKey(name); const ps = (L && L.people) || []; return k ? (ps.find(p=>p && normKey(p.name)===k) || null) : null; }
function meId(){
  const L = curList(); if(!L) return '';
  const v = viewAs[L.key];
  if(!v) return '';
  const want = (typeof v === 'string') ? {id:v, name:''} : v;
  const ps = peopleOf(L);
  let p = want.id ? ps.find(x=>x.id === want.id) : null;
  if(!p && want.name) p = ps.find(x=>normKey(x.name) === normKey(want.name));
  if(!p){ delete viewAs[L.key]; saveView(); return ''; }
  if(typeof v === 'string' || v.id !== p.id || v.name !== p.name){ viewAs[L.key] = {id:p.id, name:p.name}; saveView(); }
  return p.id;
}
function mePerson(){ return personById(curList(), meId()); }
function setMe(pid){
  const L = curList(); if(!L) return;
  const p = pid ? personById(L, pid) : null;
  if(p) viewAs[L.key] = {id:p.id, name:p.name}; else delete viewAs[L.key];
  saveView();
}
/* 관리자 화면에서는 “나”를 아직 안 골랐어도 첫 인물 기준으로 보여준다 */
function effMeId(){
  const m = meId();
  if(m) return m;
  if(!isAdmin) return '';
  const ps = peopleOf(curList());
  return ps.length ? ps[0].id : '';
}
function partEntry(room, name){ const k = normKey(name); return k ? (room.participants||[]).find(p=>normKey(p.name) === k) : null; }
function inRoom(room, name){ return !!partEntry(room, name); }
function visibleRooms(L){
  const me = personById(L, effMeId());
  if(!me) return [];
  return (L.rooms||[]).filter(r=> inRoom(r, me.name));
}
function roomsOfPerson(L, pid){
  const p = personById(L, pid);
  return p ? (L.rooms||[]).filter(r=> inRoom(r, p.name)) : [];
}
function roomPinned(room){
  const me = personById(curList(), effMeId());
  const e = me ? partEntry(room, me.name) : null;
  return !!(e && e.pinned);
}
/* 인물 이름 바꾸기 — 모든 채팅의 참여자 이름도 함께 */
function renamePerson(L, p, newName){
  const nn = String(newName||'').trim();
  if(!nn || nn === p.name) return false;
  const dup = peopleOf(L).find(x=> x !== p && normKey(x.name) === normKey(nn));
  const old = normKey(p.name);
  (L.rooms||[]).forEach(r=>{
    (r.participants||[]).forEach(x=>{ if(normKey(x.name) === old) x.name = nn; });
    const seen = {};
    r.participants = (r.participants||[]).filter(x=>{ const k = normKey(x.name); if(seen[k]) return false; seen[k] = 1; return true; });
  });
  p.name = nn;
  if(dup){
    const v = viewAs[L.key];
    if(v && ((typeof v === 'string' ? v : v.id) === dup.id)) viewAs[L.key] = {id:p.id, name:p.name};
    L.people = L.people.filter(x=> x !== dup);
  }
  const v = viewAs[L.key];
  if(v && typeof v === 'object' && v.id === p.id){ v.name = p.name; }
  saveView();
  return true;
}

/* ---------- 분류(폴더) 트리 ---------- */
function sanitizeKey(s){ return String(s||'').trim().replace(/\s+/g,'_').replace(/[?&#%\/\\]/g,''); }
function makeListKey(c1name, c2name, label, self){
  const base = [c1name, c2name, label].map(sanitizeKey).filter(Boolean).join('_') || '목록';
  let k = base, n = 2;
  while(data.lists.some(L=>L!==self && normKey(L.key)===normKey(k))){ k = base + '_' + n; n++; }
  return k;
}
function listByKey(key){ const n = normKey(key); return data.lists.find(L=>normKey(L.key)===n) || null; }
function listsOfCat(c2){ return (c2.lists||[]).map(k=>listByKey(k)).filter(Boolean); }
function catOfList(key){
  const n = normKey(key);
  for(const c1 of data.tree){ for(const c2 of c1.children){ if((c2.lists||[]).some(k=>normKey(k)===n)) return { c1:c1, c2:c2 }; } }
  return null;
}
function treeRemoveList(key){
  const n = normKey(key);
  data.tree.forEach(c1=>c1.children.forEach(c2=>{ c2.lists = (c2.lists||[]).filter(k=>normKey(k)!==n); }));
}
function treeRenameListKey(oldKey, newKey){
  const n = normKey(oldKey);
  data.tree.forEach(c1=>c1.children.forEach(c2=>{ c2.lists = (c2.lists||[]).map(k=> normKey(k)===n ? newKey : k); }));
}
function countInCat1(c1){
  let rooms = 0;
  (c1.children||[]).forEach(c2=> listsOfCat(c2).forEach(L=> rooms += (L.rooms||[]).length));
  return { subs:(c1.children||[]).length, rooms:rooms };
}
/* 중분류 하나에 GPT 한 벌 — 없으면 만들어 준다 */
function listOfCat(c1, c2){
  const have = listsOfCat(c2);
  if(have.length) return have[0];
  const L = listDefaults({ key: makeListKey(c1.name, c2.name, '', null), label:c2.name, rooms:[], people:[] });
  data.lists.push(L);
  c2.lists = [L.key];
  return L;
}
function ensureTree(d){
  if(!Array.isArray(d.tree)) d.tree = [];
  d.tree = d.tree.filter(c1=>c1 && typeof c1 === 'object');
  d.tree.forEach(c1=>{
    if(!c1.id) c1.id = id();
    c1.name = String(c1.name || '분류');
    if(!Array.isArray(c1.children)) c1.children = [];
    c1.children = c1.children.filter(c2=>c2 && typeof c2 === 'object');
    c1.children.forEach(c2=>{
      if(!c2.id) c2.id = id();
      c2.name = String(c2.name || '분류');
      if(!Array.isArray(c2.lists)) c2.lists = [];
    });
  });
  const inTree = {};
  d.tree.forEach(c1=>c1.children.forEach(c2=>c2.lists.forEach(k=>{ inTree[normKey(k)] = true; })));
  const orphans = d.lists.filter(L=>!inTree[normKey(L.key)]);
  if(orphans.length){
    let c1 = d.tree.find(c=>c.name === '미분류');
    if(!c1){ c1 = { id:id(), name:'미분류', children:[] }; d.tree.push(c1); }
    orphans.forEach(L=>{
      const nm = (L.label && L.label.trim()) ? L.label : L.key;
      c1.children.push({ id:id(), name:nm, lists:[L.key] });
    });
  }
  d.tree.forEach(c1=>c1.children.forEach(c2=>{
    c2.lists = c2.lists.filter(k=>d.lists.some(L=>normKey(L.key)===normKey(k))).slice(0,1);
  }));
}

/* ---------- 간단한 마크다운 (답변 표시용) ---------- */
function inlineMd(s){
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
  return s;
}
function mdToHtml(src){
  const lines = String(src||'').replace(/\r/g,'').split('\n');
  let out = '', i = 0, para = [];
  const flush = ()=>{ if(para.length){ out += '<p>' + para.map(x=>inlineMd(esc(x))).join('<br>') + '</p>'; para = []; } };
  while(i < lines.length){
    const ln = lines[i];
    let m;
    if(/^\s*```/.test(ln)){
      flush();
      const lang = ln.replace(/^\s*```/,'').trim();
      const buf = []; i++;
      while(i < lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
      i++;
      out += `<div class="md-code">${lang?`<div class="md-code-h">${esc(lang)}</div>`:''}<pre>${esc(buf.join('\n'))}</pre></div>`;
      continue;
    }
    if(!ln.trim()){ flush(); i++; continue; }
    if((m = ln.match(/^\s*(#{1,4})\s+(.*)$/))){
      flush(); const lv = Math.min(4, m[1].length + 1);
      out += `<h${lv}>${inlineMd(esc(m[2]))}</h${lv}>`; i++; continue;
    }
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(ln)){ flush(); out += '<hr>'; i++; continue; }
    if(/^\s*[-*•]\s+/.test(ln)){
      flush(); const items = [];
      while(i < lines.length && /^\s*[-*•]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*[-*•]\s+/,'')); i++; }
      out += '<ul>' + items.map(x=>'<li>'+inlineMd(esc(x))+'</li>').join('') + '</ul>'; continue;
    }
    if((m = ln.match(/^\s*(\d+)[.)]\s+/))){
      flush(); const start = +m[1]; const items = [];
      while(i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*\d+[.)]\s+/,'')); i++; }
      out += `<ol${start!==1?` start="${start}"`:''}>` + items.map(x=>'<li>'+inlineMd(esc(x))+'</li>').join('') + '</ol>'; continue;
    }
    if(/^\s*>\s?/.test(ln)){
      flush(); const buf = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      out += '<blockquote>' + buf.map(x=>inlineMd(esc(x))).join('<br>') + '</blockquote>'; continue;
    }
    para.push(ln); i++;
  }
  flush();
  return out;
}

function runDiag(){
  const out = [];
  const ua = navigator.userAgent || '';
  const cm = ua.match(/Chrome\/(\d+)/);
  const cv = cm ? Number(cm[1]) : 0;
  const inApp = /; wv\)|\bwv\b|KAKAOTALK|FBAN|FB_IAB|Instagram|NAVER|Line\//i.test(ua);
  out.push('코드 버전: ' + CODE_VERSION + ' / 파일 버전: ' + DATA_VERSION);
  out.push('브라우저: ' + (cm ? ('Chrome ' + cm[1]) : '크롬 아님 또는 확인 불가'));
  out.push('버전 판정: ' + (cv === 0 ? '확인 불가' : (cv >= 76 ? '앱 설치 지원 버전' : '너무 오래된 버전 — 크롬 업데이트 필요')));
  out.push('내장 브라우저: ' + (inApp ? '예 — 크롬 앱에서 직접 열어야 설치됩니다' : '아니오'));
  out.push('https(보안) 상태: ' + (window.isSecureContext ? '정상' : '아님 — 설치 불가'));
  out.push('서비스워커 상태: ' + swState);
  out.push('설치 신호(beforeinstallprompt): ' + (deferredInstall ? '받음' : '아직 없음'));
  const box = document.getElementById('diagOut');
  box.style.display = 'block';
  box.textContent = out.join('\n') + '\n서버 응답 확인 중…';
  const jobs = [];
  jobs.push(fetch('./sw.js?diag=' + Date.now(), {cache:'no-store'})
    .then(r=> 'sw.js 응답: ' + r.status + ' / ' + (r.headers.get('content-type')||'?'))
    .catch(e=> 'sw.js 응답: 실패 (' + e + ')'));
  jobs.push(fetch('./manifest.webmanifest', {cache:'no-store'})
    .then(r=> r.json().then(j=> '매니페스트 응답: ' + r.status + ' / 이름 ' + j.name, ()=> '매니페스트 응답: ' + r.status + ' / 내용 읽기 실패'))
    .catch(()=> '매니페스트 응답: 실패'));
  Promise.all(jobs).then(extra=>{ box.textContent = out.concat(extra).join('\n'); });
}

/* ----- 끌어서 순서 바꾸기 ----- */
function makeSortable(box, onDone){
  if(!box) return;
  box.classList.add('sortable');
  let el = null, armed = false, dragging = false, startY = 0, timer = null;
  const items = ()=> [].slice.call(box.querySelectorAll('[data-sort]'));
  const stop = ()=>{
    clearTimeout(timer);
    if(el) el.classList.remove('dragging');
    const did = dragging;
    el = null; armed = false; dragging = false;
    if(did) onDone(items().map(x=>x.dataset.sort));
  };
  box.addEventListener('pointerdown', e=>{
    const t = e.target.closest('[data-sort]');
    if(!t || e.target.closest('button, input, textarea, select, .node-name')) return;
    el = t; startY = e.clientY; armed = false; dragging = false;
    if(e.pointerType === 'mouse'){ armed = true; }
    else { timer = setTimeout(()=>{ armed = true; el.classList.add('dragging'); }, 280); }
  });
  box.addEventListener('pointermove', e=>{
    if(!el) return;
    if(!armed){ if(Math.abs(e.clientY - startY) > 8){ clearTimeout(timer); el = null; } return; }
    if(!dragging){
      if(Math.abs(e.clientY - startY) < 4) return;
      dragging = true; el.classList.add('dragging');
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    }
    const y = e.clientY;
    items().forEach(s=>{
      if(s === el) return;
      const r = s.getBoundingClientRect();
      if(y > r.top && y < r.bottom){
        if(y < r.top + r.height/2) box.insertBefore(el, s);
        else box.insertBefore(el, s.nextSibling);
      }
    });
  });
  box.addEventListener('pointerup', stop);
  box.addEventListener('pointercancel', stop);
  box.addEventListener('touchmove', e=>{ if(dragging) e.preventDefault(); }, {passive:false});
}

function uniqueName(existing, base){ let n = base, i = 2; while(existing.indexOf(n) !== -1){ n = base + ' ' + i; i++; } return n; }
function keysUnderC1(c1){ const out = []; (c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>out.push(k))); return out; }
function deleteListByKey(key){
  const L = listByKey(key);
  if(!L) return;
  const cur = data.lists[listIdx];
  const i = data.lists.indexOf(L);
  data.lists.splice(i, 1);
  treeRemoveList(key);
  const ni = data.lists.indexOf(cur);
  listIdx = (ni >= 0) ? ni : Math.max(0, Math.min(i, data.lists.length - 1));
}
function reorderListsByTree(){
  const cur = data.lists[listIdx];
  const seen = {}, out = [];
  data.tree.forEach(c1=>(c1.children||[]).forEach(c2=>(c2.lists||[]).forEach(k=>{
    const L = listByKey(k);
    if(L && !seen[normKey(L.key)]){ seen[normKey(L.key)] = 1; out.push(L); }
  })));
  data.lists.forEach(L=>{ if(!seen[normKey(L.key)]) out.push(L); });
  data.lists = out;
  const i = data.lists.indexOf(cur);
  listIdx = (i >= 0) ? i : 0;
}

    const n = roomsOfPerson(L, p.id).length;
    confirmDialog('인물 “' + p.name + '” 을(를) 명단에서 지울까요?'
      + (n ? '\n참여 중인 채팅 ' + n + '개에서도 빠집니다. (채팅과 메시지는 그대로 남습니다)' : ''), ()=>{
      const k = normKey(p.name);
      const wasMe = (meId() === p.id);
      (L.rooms||[]).forEach(r=>{ r.participants = (r.participants||[]).filter(x=>normKey(x.name) !== k); });
      L.people = L.people.filter(x=>x.id !== p.id);
      if(wasMe){ delete viewAs[L.key]; saveView(); }
      save(); renderAdminHome(); toast('지웠습니다');
    });
  });
  body.querySelectorAll('[data-rename]').forEach(el=>{
    el.ondblclick = ()=>{ editingNode = el.dataset.rename; renderAdminHome(); };
  });

  const nSave = $('#nodeSave');
  if(nSave){
    const nName = $('#nodeName'), nKey = $('#nodeKey');
    const cur = body.querySelector(`[data-rename="${editingNode}"]`);
    nName.value = cur ? cur.dataset.cur : '';
    setTimeout(()=>{ try{ nName.focus(); nName.select(); }catch(e){} }, 0);
    $('#nodeCancel').onclick = ()=>{ editingNode = ''; renderAdminHome(); };
    const makeKeyNow = ()=>{
      const c1 = curC1();
      const node = c1 && (c1.children||[]).find(c=>c.id === editingNode.slice(3));
      const self = node ? listsOfCat(node)[0] : null;
      return makeListKey(c1?c1.name:'', nName.value.trim() || '중분류', '', self);
    };
    if(nKey){
      let keyTouched = false;
      nKey.oninput = ()=>{ keyTouched = true; };
      nName.oninput = ()=>{ if(!keyTouched) nKey.value = makeKeyNow(); };
    }
    const auto = $('#nodeAuto');
    if(auto) auto.onclick = ()=>{ if(nKey) nKey.value = makeKeyNow(); };
    nName.onkeydown = e=>{ if(e.key === 'Enter') nSave.click(); };
    nSave.onclick = ()=>{
      const nameVal = nName.value.trim();
      if(!nameVal){ toast('이름을 입력하세요'); return; }
      if(nKey && !nKey.value.trim()) nKey.value = makeKeyNow();
      if(editingNode.indexOf('c1:') === 0){
        const node = data.tree.find(c=>c.id === editingNode.slice(3));
        if(node) node.name = nameVal;
      } else if(editingNode.indexOf('P:') === 0){
        const L = curList();
        const p = personById(L, editingNode.slice(2));
        if(p && p.name !== nameVal && !renamePerson(L, p, nameVal)){ toast('이름을 바꾸지 못했습니다'); return; }
      } else if(editingNode.indexOf('c2:') === 0){
        const c1 = curC1();
        const node = c1 && (c1.children||[]).find(c=>c.id === editingNode.slice(3));
        if(node){
          node.name = nameVal;
          const L = listsOfCat(node)[0];
          if(L){
            L.label = nameVal;
            const oldKey = L.key;
            const newKey = sanitizeKey(nKey ? nKey.value : '');
            if(newKey && normKey(newKey) !== normKey(oldKey)){
              if(data.lists.some(x=>x !== L && normKey(x.key) === normKey(newKey))){ toast('같은 주소용 이름이 이미 있습니다'); return; }
              L.key = newKey;
              L.aliases = (L.aliases||[]).concat([oldKey]).filter(a=>normKey(a) !== normKey(newKey));
              if(viewAs[oldKey]){ viewAs[newKey] = viewAs[oldKey]; delete viewAs[oldKey]; saveView(); }
              treeRenameListKey(oldKey, newKey);
              try{ if(savedListKey() && normKey(savedListKey()) === normKey(oldKey)) localStorage.setItem(LAST_KEY, newKey); }catch(e){}
            }
          }
        }
      }
      editingNode = ''; save(); syncUrl(); renderAdminHome(); toast('저장되었습니다');
    };
  }

  const add = $('#treeAdd');
  if(add) add.onclick = ()=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1){
      data.tree.push({ id:id(), name:uniqueName(data.tree.map(x=>x.name), '새 대분류'), children:[] });
    } else if(!c2){
      const node = { id:id(), name:uniqueName(c1.children.map(x=>x.name), '새 중분류'), lists:[] };
      c1.children.push(node);
      listOfCat(c1, node);
    } else {
      const L = listOfCat(c1, c2);
      const list = peopleOf(L);
      const nm = uniqueName(list.map(p=>p.name), '새 인물');
      list.push({ id:personId(nm), name:nm });
      editingNode = 'P:' + personId(nm);
    }
    save(); renderAdminHome();
  };

  body.querySelectorAll('[data-cdel]').forEach(b=> b.onclick = ()=>{
    const v = b.dataset.cdel;
    const isC1 = (v.indexOf('c1:') === 0);
    let node, keys, removeIt;
    if(isC1){
      const i = data.tree.findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = data.tree[i]; keys = keysUnderC1(node);
      removeIt = ()=> data.tree.splice(i, 1);
    } else {
      const c1 = curC1(); if(!c1) return;
      const i = (c1.children||[]).findIndex(c=>c.id === v.slice(3));
      if(i < 0) return;
      node = c1.children[i]; keys = (node.lists||[]).slice();
      removeIt = ()=> c1.children.splice(i, 1);
    }
    if(keys.length && keys.length >= data.lists.length){ toast('목록은 최소 1개 필요합니다. 다른 분류에 목록을 남겨두세요.'); return; }
    let rooms = 0;
    keys.forEach(k=>{ const L = listByKey(k); if(L) rooms += (L.rooms||[]).length; });
    const doIt = ()=>{
      const openKey = curList() ? curList().key : '';
      keys.forEach(k=>deleteListByKey(k));
      removeIt();
      if(keys.some(k=>normKey(k) === normKey(openKey))){ adminListPicked = false; adminRoomId = ''; currentRoomId = null; }
      save(); renderAdminHome(); toast('삭제되었습니다');
    };
    if(rooms) confirmDialog('“' + node.name + '” 안에 채팅 ' + rooms + '개가 있습니다.\n대화 내용까지 모두 삭제할까요?', doIt, '모두 삭제');
    else confirmDialog('“' + node.name + '” 분류를 삭제할까요?', doIt);
  });

  body.querySelectorAll('[data-lcopy]').forEach(b=> b.onclick = ()=>{
    const src = listByKey(b.dataset.lcopy);
    const c1 = curC1();
    if(!src || !c1) return;
    const c = catOfList(src.key);
    const nodeName = uniqueName(c1.children.map(x=>x.name), (c ? c.c2.name : listLabel(src)) + ' 사본');
    const copy = deepCopy(src);
    copy.label = nodeName;
    copy.aliases = [];
    copy.key = makeListKey(c1.name, nodeName, '', null);
    copy.rooms.forEach(r=>{ r.id = id(); r.participants.forEach(p=>p.id = id()); r.messages.forEach(m=>m.id = id()); });
    data.lists.push(copy);
    const at = c ? (c1.children.indexOf(c.c2) + 1) : c1.children.length;
    c1.children.splice(at, 0, { id:id(), name:nodeName, lists:[copy.key] });
    save(); renderAdminHome(); toast('복제되었습니다');
  });

  makeSortable($('#treeBox'), order=>{
    const c1 = curC1(), c2 = curC2();
    if(!c1) data.tree = order.map(v=>data.tree.find(c=>c.id === v)).filter(Boolean);
    else if(!c2){ c1.children = order.map(v=>(c1.children||[]).find(c=>c.id === v)).filter(Boolean); reorderListsByTree(); }
    else {
      const L = curList();
      L.people = order.map(v=>peopleOf(L).find(p=>p.id === v)).filter(Boolean).concat(peopleOf(L).filter(p=>order.indexOf(p.id) < 0));
    }
    save(); renderAdminHome(); toast('순서가 바뀌었습니다');
  });
}

/* ----- 다른 중분류의 채팅 불러오기 ----- */
let impPath = [];
function importRoomPanel(){
  const c1 = impPath[0] ? data.tree.find(c=>c.id === impPath[0]) : null;
  const c2 = (c1 && impPath[1]) ? (c1.children||[]).find(c=>c.id === impPath[1]) : null;
  const L  = c2 ? listsOfCat(c2)[0] : null;
  let rows = '';
  if(!c1){
    data.tree.forEach(node=>{
      rows += `<div class="admin-list-item"><div class="top"><div class="rname">${esc(node.name)}</div>
        <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button></div></div>`;
    });
  } else if(!c2){
    (c1.children||[]).forEach(node=>{
      const x = listsOfCat(node)[0];
      rows += `<div class="admin-list-item"><div class="top"><div><div class="rname">${esc(node.name)}</div>
        <div class="rsub">채팅 ${x ? x.rooms.length : 0}개</div></div>
        <button class="btn btn-ghost btn-sm" data-impgo="${node.id}">열기</button></div></div>`;
    });
  } else if(!L || !L.rooms.length){
    rows = '<div class="hint" style="margin:0">이 중분류에는 채팅이 없습니다.</div>';
  } else {
    L.rooms.forEach((r, ri)=>{
      const same = (L === curList());
      rows += `<div class="admin-list-item"><div class="top"><div style="min-width:0">
        <div class="rname">${esc(r.title||'새 채팅')}</div>
        <div class="rsub">${esc(r.participants.map(p=>p.name).join(', '))} · 메시지 ${r.messages.length}개</div></div>
        ${same ? '<span class="rsub">지금 중분류</span>' : `<button class="btn btn-primary btn-sm" data-imp="${esc(L.key)}:${ri}">불러오기</button>`}
        </div></div>`;
    });
  }
  const crumb = [c1 && c1.name, c2 && c2.name].filter(Boolean).join(' › ') || '전체 분류';
  return `
    <div style="background:#f7f9fb;border:1px solid #e3e7ec;border-radius:10px;padding:10px;margin-bottom:10px">
      <div class="hint" style="margin:0 0 8px">다른 중분류의 채팅을 <b>대화 내용 그대로</b> 여기로 복사합니다. 원본은 그대로 남습니다.</div>
      <div class="crumb">
        ${impPath.length ? '<button class="btn btn-ghost btn-sm" id="impUp">↑ 상위 폴더</button>' : ''}
        <span class="crumb-txt">${esc(crumb)}</span>
      </div>
      ${rows}
      <button class="btn btn-ghost btn-sm btn-block" id="importRoomClose">닫기</button>
    </div>`;
}

function bindRoomListSection(root){
  makeSortable(root.querySelector('#roomBox'), order=>{
    const L = curList();
    L.rooms = order.map(v=>L.rooms.find(r=>r.id === v)).filter(Boolean)
      .concat(L.rooms.filter(r=>order.indexOf(r.id) < 0));
    save(); renderAdminHome(); toast('순서가 바뀌었습니다');
  });
  const ar = $('#addRoom'); if(ar) ar.onclick = addRoom;
  const irb = $('#importRoomBtn'); if(irb) irb.onclick = ()=>{ importOpen = !importOpen; if(importOpen) impPath = []; renderAdminHome(); };
  const irc = $('#importRoomClose'); if(irc) irc.onclick = ()=>{ importOpen = false; renderAdminHome(); };
  const iup = $('#impUp'); if(iup) iup.onclick = ()=>{ impPath.pop(); renderAdminHome(); };
  root.querySelectorAll('[data-impgo]').forEach(b=> b.onclick = ()=>{ impPath.push(b.dataset.impgo); renderAdminHome(); });
  root.querySelectorAll('[data-imp]').forEach(b=> b.onclick = ()=>{
    const raw = String(b.dataset.imp);
    const cut = raw.lastIndexOf(':');
    const srcList = listByKey(raw.slice(0, cut));
    const src = srcList && srcList.rooms[+raw.slice(cut+1)];
    if(!src){ toast('원본 채팅을 찾을 수 없습니다'); return; }
    const copy = deepCopy(src);
    copy.id = id();
    copy.participants.forEach(p=> p.id = id());
    copy.messages.forEach(m=> m.id = id());
    curList().rooms.push(copy);
    ensurePeople(curList());
    save(); renderAdminHome();
    toast(`“${copy.title}” 채팅을 불러왔습니다`);
  });
  root.querySelectorAll('[data-edit]').forEach(b=> b.onclick = ()=> editRoom(b.dataset.edit));
  root.querySelectorAll('[data-del]').forEach(b=> b.onclick = ()=> delRoom(b.dataset.del));
  root.querySelectorAll('[data-dup]').forEach(b=> b.onclick = ()=> dupRoom(b.dataset.dup));
  root.querySelectorAll('[data-up]').forEach(b=> b.onclick = ()=> moveRoom(b.dataset.up,-1));
  root.querySelectorAll('[data-down]').forEach(b=> b.onclick = ()=> moveRoom(b.dataset.down,1));
}

function addRoom(){

  L.rooms.unshift(room); save(); editRoom(room.id);
}
function dupRoom(rid){
  const L = curList();
  const src = findRoom(rid); if(!src) return;
  const copy = deepCopy(src);
  copy.id = id(); copy.title = (src.title||'새 채팅') + ' 사본';
  copy.participants.forEach(p=> p.id = id());
  copy.messages.forEach(m=> m.id = id());
  L.rooms.splice(L.rooms.indexOf(src)+1, 0, copy);
  save(); editRoom(copy.id); toast('복제되었습니다');
}
function delRoom(rid){
  const room = findRoom(rid);
  confirmDialog(`“${room?room.title:''}” 채팅을 삭제할까요?`, ()=>{
    const L = curList();
    L.rooms = L.rooms.filter(r=>r.id!==rid);
    if(adminRoomId === rid) adminRoomId = '';
    if(currentRoomId === rid) currentRoomId = null;
    save(); renderAdminHome(); toast('삭제되었습니다');
  });
}
function moveRoom(rid, dir){
  const L = curList();
  const i = L.rooms.findIndex(r=>r.id===rid);
  const j = i+dir;
  if(j<0||j>=L.rooms.length) return;
  [L.rooms[i], L.rooms[j]] = [L.rooms[j], L.rooms[i]];
  save(); renderAdminHome();
}

const PHOTO_W = 900, PHOTO_Q = 0.75;
function resizeImageFit(file, maxW, cb){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if(w > maxW){ h = Math.round(h*maxW/w); w = maxW; }
      canvas.width = w; canvas.height = h;
      const cx = canvas.getContext('2d');
      cx.imageSmoothingQuality = 'high';
      cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
      cx.drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', PHOTO_Q));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ----- 백업 / 새 index.html 만들기 ----- */
function downloadFile(name, text, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 5000);
}
function newVersion(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
/* 서버 없이(파일을 직접 열었을 때도) 자기 자신의 소스를 만들어 낸다 */
function selfHtml(){
  const root = document.documentElement.cloneNode(true);
  ['#thread','#suggest','#drList','#branchList','#paneHome','#paneRoom','#paneMsgs'].forEach(sel=>{
    const el = root.querySelector(sel); if(el) el.innerHTML = '';
  });
  const off = (sel, cls)=>{ const el = root.querySelector(sel); if(el) el.classList.remove(cls); };
  off('#adminOverlay','active'); off('#drawer','open'); off('#pickBranch','show');
  off('#photoViewer','show'); off('#modePill','show'); off('#confirmBox','show'); off('#toast','show');
  const ab = root.querySelector('#adminBody'); if(ab) ab.className = 'admin-body room-open';
  const sg = root.querySelector('#suggest'); if(sg) sg.removeAttribute('style');
  const pi = root.querySelector('#photoViewerImg'); if(pi) pi.removeAttribute('src');
  const ts = root.querySelector('#toast'); if(ts) ts.textContent = '';
  const ph = root.querySelector('#phone'); if(ph) ph.setAttribute('style', '--safe-b: 0px;');
  return '<!DOCTYPE html>\n' + root.outerHTML + '\n';
}
function stripHostInjected(html){
  let out = html;
  out = out.replace(/<!--(?:(?!-->)[\s\S]){0,1000}?netlify\.new(?:(?!-->)[\s\S]){0,1000}?-->\s*/gi, '');
  out = out.replace(/<meta\s+name="hosting-provider"[^>]*>\s*/gi, '');
  out = out.replace(/<script\b[^>]*src="\/\.netlify\/[^>]*>\s*<\/script>\s*/gi, '');
  return out;
}
function buildHtmlFrom(tpl){
  const src = stripHostInjected(tpl);
  const i = src.indexOf(MARK_S), j = src.indexOf(MARK_E);
  if(i < 0 || j <= i) return null;
  const ver = newVersion();
  const json = JSON.stringify(data, null, 1).replace(/<\//g, '<\\/');
  const block = MARK_S + ' 아래 두 줄이 이 파일에 들어있는 대화 내용입니다. */\n'
    + 'const DATA_VERSION = ' + JSON.stringify(ver) + ';\n'
    + 'const EMBEDDED_DATA = ' + json + ';\n';
  return { html: src.slice(0,i) + block + src.slice(j), version: ver };
}
function finishExportHtml(built){
  if(!built){ toast('파일을 만들 수 없습니다'); return; }
  downloadFile('index.html', built.html, 'text/html;charset=utf-8');
  baseFp = fingerprint(data);
  save();
  toast('새 index.html 저장됨 · 버전 ' + built.version);
  if($('#adminOverlay').classList.contains('active')) renderAdminHome();
}
function exportHtml(){
  if(location.protocol.indexOf('http') !== 0){
    confirmDialog('지금 화면에 열려 있는 상태로 파일을 만듭니다.\n기능이 바뀐 파일을 새로 받았다면 먼저 새로고침(F5) 후에 만들어 주세요.',
      ()=> finishExportHtml(buildHtmlFrom(selfHtml())), '만들기');
    return;
  }
  fetch('./index.html?_ex=' + Date.now(), {cache:'no-store'})
    .then(r=> r.ok ? r.text() : Promise.reject())
    .then(tpl=> finishExportHtml(buildHtmlFrom(tpl)))
    .catch(()=> finishExportHtml(buildHtmlFrom(selfHtml())));
}
function exportData(){
  const payload = { app:'단서GPT', version:DATA_VERSION, exportedAt:new Date().toISOString(), data:data };
  downloadFile('단서GPT_백업.json', JSON.stringify(payload,null,2), 'application/json');
  toast('백업 파일을 저장했습니다');
}
function importData(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try {
      const parsed = JSON.parse(reader.result);
      const body = (parsed && parsed.data) ? parsed.data : parsed;
      if(!body || !Array.isArray(body.lists)) throw new Error('bad');
      data = normalize(body);
      listIdx = 0; currentRoomId = null;
      if(!baseFp) baseFp = fingerprint(normalize(deepCopy(EMBEDDED_DATA)));
      save();
      toast('불러왔습니다');
      renderAdminHome(true);
    } catch(err){ toast('올바른 백업 파일이 아닙니다'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

/* 사이드바를 왼쪽으로 밀어 닫기 */
(function(){
  let sx = null, sy = 0;
  const p = $('#drPanel');
  p.addEventListener('touchstart', e=>{ sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  p.addEventListener('touchend', e=>{
    if(sx === null) return;
    const t = e.changedTouches[0];
    if(sx - t.clientX > 60 && Math.abs(t.clientY - sy) < 60 && drawerOpen()) goBack();
    sx = null;
  });
  /* 메인 화면 왼쪽 끝에서 오른쪽으로 밀면 사이드바 열기 */
  const h = $('#home');
  let hx = null, hy = 0;
  h.addEventListener('touchstart', e=>{ const x = e.touches[0].clientX; hx = x < 40 ? x : null; hy = e.touches[0].clientY; }, {passive:true});
  h.addEventListener('touchend', e=>{
    if(hx === null) return;
    const t = e.changedTouches[0];
    if(t.clientX - hx > 60 && Math.abs(t.clientY - hy) < 60 && !drawerOpen()) openDrawer();
    hx = null;
  });
})();

document.addEventListener('contextmenu', e=>{
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
  if(isAdmin) return;
  e.preventDefault();
});
document.addEventListener('dragstart', e=>{ if(!isAdmin) e.preventDefault(); });

/* 5초 길게 눌러 관리자 진입 — 사이드바 제목 “ChatGPT” 또는 가운데 Chat/Work */
function bindLongPress(el){
  let timer = null;
  const start = ()=>{ clearTimeout(timer); timer = setTimeout(()=>{ openAdmin(); }, 5000); };
  const cancel = ()=> clearTimeout(timer);
  el.addEventListener('mousedown', start);
  el.addEventListener('touchstart', start, {passive:true});
  ['mouseup','mouseleave','touchend','touchcancel','touchmove'].forEach(ev=> el.addEventListener(ev, cancel));
}
bindLongPress($('#drTitle'));
bindLongPress($('#seg'));

/* ---------- 시작 ---------- */
let bootTries = 0;
function decideStartScreen(){
  if(!data) return;
  if(!window.innerWidth && bootTries < 20){ bootTries++; setTimeout(decideStartScreen, 200); return; }
  if(wideAdmin()){
    if(!isAdmin){ isAdmin = true; renderGuest(); openAdmin(!meId()); }
    return;
  }
  if(!lockedC1() && (data.tree||[]).length){ renderBranchPicker(); return; }
  fixListForBranch();
  if(!meId()){ isAdmin = true; renderGuest(); openAdmin(true); return; }
  renderGuest();
  if(curList().startDrawer && !drawerOpen() && !startedDrawer){ startedDrawer = true; openDrawer(); }
}
let startedDrawer = false;
let startDone = false;

let bootErrors = [];
function step(name, fn){
  try{ fn(); }
  catch(e){ bootErrors.push({ where:name, err:e }); try{ console.error('[단서GPT] ' + name + ' 실패', e); }catch(x){} }
}
function showBootError(){
  const el = document.getElementById('thread');
  if(!el) return;
  const lines = bootErrors.map(b=>{ const e = b.err || {}; return '<b>' + esc(b.where) + '</b> — ' + esc(String(e.message || e.name || e)); });
  el.innerHTML = '<div class="empty" style="user-select:text;-webkit-user-select:text">내용을 불러오지 못했습니다.<br><br>'
    + '주소 끝에 <b>?reset=1</b> 을 붙여 다시 열어보세요.<br><br>'
    + '<span style="font-size:11px">코드 버전 ' + esc(CODE_VERSION) + '<br>' + (lines.join('<br>') || '응답 없음') + '</span></div>';
}

(function boot(){
  let first = Promise.resolve();
  if(/[?&]reset=1/.test(location.search)){
    try{ [STORE_KEY, LAST_KEY, VIEW_KEY, PAD_KEY, BRANCH_KEY].forEach(k=>localStorage.removeItem(k)); }catch(e){}
    try{ first = idbClear(); }catch(e){}
    try{ if(window.caches && caches.keys) caches.keys().then(ks=>ks.forEach(k=>{ if(isMyCache(k)) caches.delete(k); })); }catch(e){}
    try{
      if(navigator.serviceWorker && navigator.serviceWorker.getRegistrations){
        navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{ if(isMySW(r)) r.unregister(); }));
      }
    }catch(e){}
  }
  first.catch(()=>{}).then(load).then(d=>{
    data = d;
    step('loadView', loadView);
    step('loadBranch', loadBranch);
    step('selectListFromUrl', selectListFromUrl);
    step('save', save);
    step('syncUrl', syncUrl);
    step('renderGuest', renderGuest);
    try{ askPersist().then(refreshQuota).then(()=>{ try{ refreshAdminInfo(); }catch(e){} }); }catch(e){}
    if(saveBlocked) setTimeout(()=>toast('저장된 내용을 읽지 못했습니다. 내용 보호를 위해 저장을 멈췄습니다 — 앱을 껐다 켜 주세요.'), 700);
    step('decideStartScreen', decideStartScreen);
    if(bootErrors.length) showBootError();
  }).catch(err=>{ bootErrors.push({ where:'load', err:err }); showBootError(); });
})();
setTimeout(function(){
  if(!data){ bootErrors.push({ where:'load', err:{message:'저장된 내용을 읽는 중 응답이 없습니다'} }); showBootError(); }
}, 6000);

/* 서비스워커: 최신 파일 우선(network-first) */
if(!('serviceWorker' in navigator)) swState = '이 브라우저는 지원 안 함';
else if(location.protocol.indexOf('http') !== 0) swState = '파일 직접 열기 — 사용 불가';
else {
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{ swState = '작동 중'; refreshAdminInfo(); });
  navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(DATA_VERSION), {updateViaCache:'none'})
    .then(()=>{ swState = '등록됨 (제어 대기)'; refreshAdminInfo(); return navigator.serviceWorker.ready; })
    .then(()=>{ swState = navigator.serviceWorker.controller ? '작동 중' : '등록됨 (새로고침하면 작동)'; refreshAdminInfo(); })
    .catch(e=>{ swState = '등록 실패: ' + ((e && e.message) ? e.message : String(e)); refreshAdminInfo(); });
}
